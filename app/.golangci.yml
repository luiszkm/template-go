version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - gosec
    - misspell
    - errorlint
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    paths:
      - archtest/testdata
    rules:
      - path: _test\.go
        linters: [gosec]
      # Developer CLIs: reading and writing paths given by the developer is their job.
      - path: cmd/(agenthooks|fmtcheck|newslice|sqlcrun|webcopy)/
        linters: [gosec]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/luiszkm/template-go
