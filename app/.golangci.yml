version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - gosec
    - misspell
    - errorlint
    - testifylint
    - nolintlint
    - modernize
    - noctx
    - containedctx
    - forcetypeassert
    - nilerr
    - usetesting
    - thelper
    - sloglint
  settings:
    sloglint:
      attr-only: true
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    paths:
      - archtest/testdata
    rules:
      - path: _test\.go
        linters: [gosec]
      - path: cmd/(agenthooks|fmtcheck|newslice|sqlcrun|webcopy)/
        linters: [gosec]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/luiszkm/template-go
