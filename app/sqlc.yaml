version: "2"
# uuid and timestamptz map to the types the handlers use (nullable timestamptz -> *time.Time).
overrides:
  go:
    overrides:
      - db_type: uuid
        go_type: github.com/google/uuid.UUID
      - db_type: timestamptz
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type:
          type: time.Time
          pointer: true
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/features/users/login/queries.sql
    gen:
      go:
        package: db
        out: internal/features/users/login/db
        sql_package: pgx/v5
