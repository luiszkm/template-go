version: "3"

vars:
  GOTOOL: go tool -modfile=tools/go.mod

env:
  DATABASE_URL: '{{.DATABASE_URL | default "postgres://app:app@localhost:5432/app?sslmode=disable"}}'

tasks:
  default:
    cmds: [task --list]
    silent: true

  check:
    desc: Full gate - run before declaring any work done. Stops at the first failing step.
    cmds:
      - task: fmt:check
      - task: lint
      - task: gen:check
      - task: archtest
      - task: test
      - task: web:typecheck
      - task: web:lint
      - task: web:test

  check:fast:
    desc: Seconds-scale subset used by the Claude Code Stop hook (no containers).
    cmds:
      - task: fmt:check
      - task: vet
      - task: archtest
      - task: web:typecheck

  fmt:check:
    desc: Fail if any Go file is not gofmt-formatted.
    dir: app
    cmds:
      - go run ./cmd/fmtcheck

  vet:
    dir: app
    cmds:
      - go vet ./...

  lint:
    desc: golangci-lint over the Go module.
    dir: app
    cmds:
      - "{{.GOTOOL}} golangci-lint run ./..."

  archtest:
    desc: Architecture rules (imports between features, migration names, harness files).
    dir: app
    cmds:
      - go test -count=1 ./archtest

  test:
    desc: Every Go test. Postgres tests need Docker.
    dir: app
    env:
      GOFLAGS: -p=4 -timeout=30m
    cmds:
      - go test -count=1 ./...

  gen:
    desc: Regenerate sqlc code, app/openapi.json and the web API types.
    cmds:
      - task: gen:sqlc
      - task: gen:openapi
      - task: gen:web

  gen:sqlc:
    dir: app
    cmds:
      - go run ./cmd/sqlcrun generate

  gen:openapi:
    dir: app
    cmds:
      - go run ./cmd/api openapi > openapi.json

  gen:web:
    dir: web
    cmds:
      - npm run gen

  gen:check:
    desc: Fail if any generated file differs from its source.
    cmds:
      - task: gen:sqlc:check
      - task: gen:openapi:check
      - task: gen:web:check

  gen:sqlc:check:
    dir: app
    cmds:
      - go run ./cmd/sqlcrun diff

  gen:openapi:check:
    dir: app
    cmds:
      - go test -count=1 ./internal/app -run '^TestOpenAPI_ServedMatchesCommitted$'

  gen:web:check:
    dir: web
    cmds:
      - npm run gen:check

  web:install:
    dir: web
    sources: [package.json, package-lock.json]
    cmds:
      - npm ci

  web:typecheck:
    dir: web
    cmds:
      - npm run typecheck

  web:lint:
    dir: web
    cmds:
      - npm run lint

  web:test:
    dir: web
    cmds:
      - npm test

  new:slice:
    desc: "Create a slice: task new:slice FEATURE=users NAME=create_user"
    requires:
      vars: [FEATURE, NAME]
    dir: app
    cmds:
      - go run ./cmd/newslice --feature "{{.FEATURE}}" --name "{{.NAME}}"
      - task: gen

  db:up:
    desc: Start Postgres in Docker and wait until it is healthy.
    cmds:
      - docker compose up -d --wait db

  migrate:
    desc: Apply pending migrations.
    dir: app
    cmds:
      - go run ./cmd/api migrate up

  build:
    desc: Build the SPA, embed it, and build app/bin/api.
    cmds:
      - task: web:build
      - task: webui:copy
      - task: build:api

  build:api:
    dir: app
    cmds:
      - go build -o bin/api{{exeExt}} ./cmd/api

  web:build:
    dir: web
    cmds:
      - npm run build

  webui:copy:
    dir: app
    cmds:
      - go run ./cmd/webcopy ../web/dist internal/platform/webui/dist

  dev:
    desc: Postgres + migrations, then the API on :8080 and Vite on :5173 (open http://localhost:5173).
    cmds:
      - task: db:up
      - task: migrate
      - task: dev:run

  dev:run:
    deps: [dev:api, dev:web]

  dev:api:
    dir: app
    env:
      COOKIE_SECURE: "false"
    cmds:
      - go run ./cmd/api serve

  dev:web:
    dir: web
    cmds:
      - npm run dev

  e2e:
    desc: Playwright against the built binary (starts Postgres and the server itself).
    dir: web
    cmds:
      - npx playwright test {{.CLI_ARGS}}

  e2e:serve:
    desc: Used by Playwright's webServer - build, migrate and serve on :8080.
    cmds:
      - task: build
      - task: db:up
      - task: migrate
      - task: serve:bin

  serve:bin:
    dir: app
    env:
      COOKIE_SECURE: "false"
    cmds:
      - ./bin/api{{exeExt}} serve
